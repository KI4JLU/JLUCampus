# Production: Postgres, MinIO (transcription audio) and the published app image. Keycloak runs
# elsewhere. Live transcription needs nothing more: browsers stream to the app's own WebSocket
# (/api/modules/transcription/live) through the reverse proxy, which must pass WebSocket upgrades.
#   cp .env.production.example .env.production   # fill in the secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# The app applies database migrations on every start.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-justcampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-justcampus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${JUSTCAMPUS_IMAGE:-ghcr.io/ki4jlu/jlucampus}:${JUSTCAMPUS_TAG:-latest}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-justcampus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-justcampus}
      # Only the app reaches MinIO, inside the compose network; browsers go through the app.
      TRANSCRIPTION_S3_ENDPOINT: http://minio:9000
      TRANSCRIPTION_S3_BUCKET: ${TRANSCRIPTION_S3_BUCKET:-justcampus-transcription}
      TRANSCRIPTION_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-justcampus}
      TRANSCRIPTION_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    # Put a TLS-terminating reverse proxy in front; it should reach this port, WebSocket upgrades
    # for /api included (live transcription), with a read timeout above a minute and request
    # bodies up to the transcription file limit (500 MB by default).
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'

  # Object storage for transcription audio; only the app talks to it.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-justcampus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data

  # Creates the bucket, then exits; the app starts after it.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-justcampus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET: ${TRANSCRIPTION_S3_BUCKET:-justcampus-transcription}
    entrypoint:
      - sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done &&
        mc mb --ignore-existing "local/$$BUCKET" &&
        mc anonymous set none "local/$$BUCKET"

volumes:
  postgres-data:
  minio-data:
