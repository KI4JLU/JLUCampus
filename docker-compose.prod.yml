# Production: Postgres, MinIO (transcription audio) and the published app image. Keycloak runs
# elsewhere. On-prem live transcription (realtime bridge and TURN relay) is the profile
# `realtime`: COMPOSE_PROFILES=realtime in .env.production, see infra/realtime-bridge/README.md.
#   cp .env.production.example .env.production   # fill in the secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# The app applies database migrations on every start.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-justcampus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-justcampus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${JUSTCAMPUS_IMAGE:-ghcr.io/ki4jlu/jlucampus}:${JUSTCAMPUS_TAG:-latest}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-justcampus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-justcampus}
      # The app reaches MinIO inside the compose network; browsers use the public endpoint.
      TRANSCRIPTION_S3_ENDPOINT: http://minio:9000
      TRANSCRIPTION_S3_BUCKET: ${TRANSCRIPTION_S3_BUCKET:-justcampus-transcription}
      TRANSCRIPTION_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-justcampus}
      TRANSCRIPTION_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    # Put a TLS-terminating reverse proxy in front; it should reach this port.
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'
    # The realtime bridge runs on the host's network: the app reaches it as
    # http://host.docker.internal:8089 (the module's bridge address; list host.docker.internal in
    # NO_PROXY when a proxy is set).
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Object storage for transcription audio. Browsers upload to and play from it with signed URLs,
  # so the reverse proxy must publish this port on its own host name
  # (TRANSCRIPTION_S3_PUBLIC_ENDPOINT); a path prefix would break the signatures.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-justcampus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:?set CORS_ORIGINS}
    volumes:
      - minio-data:/data
    ports:
      - '${MINIO_BIND:-127.0.0.1}:${MINIO_PORT:-9000}:9000'

  # Creates the bucket, then exits; the app starts after it.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-justcampus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET: ${TRANSCRIPTION_S3_BUCKET:-justcampus-transcription}
    entrypoint:
      - sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done &&
        mc mb --ignore-existing "local/$$BUCKET" &&
        mc anonymous set none "local/$$BUCKET"

  # ---- Live transcription, on-prem (COMPOSE_PROFILES=realtime) ----
  # The realtime bridge (infra/realtime-bridge, ported from kiChat) takes the browsers' WebRTC
  # audio and streams it to the gateway's realtime WebSocket ({gateway}/v1/realtime). The app
  # relays the SDP offers to it with the gateway's base, key and model per session; the bridge
  # stores none of them and browsers never reach its HTTP API. Host networking, as WebRTC media
  # runs over UDP on ephemeral ports and the ICE candidates must carry the host's addresses.
  # Port 8089 listens on every interface so the app container reaches it: keep it closed in the
  # host firewall. TRANSCRIPTION_REALTIME_BRIDGE_KEY (its BRIDGE_API_KEY) is required: without it
  # the bridge refuses to start. At most REALTIME_BRIDGE_MAX_SESSIONS sessions run at once; one
  # without audio for REALTIME_BRIDGE_IDLE_TIMEOUT_S or longer than REALTIME_BRIDGE_MAX_SESSION_S
  # is finalized.
  # Built from this checkout: docker compose -f docker-compose.prod.yml build realtime-bridge
  realtime-bridge:
    profiles: ['realtime']
    build: ./infra/realtime-bridge
    image: ${REALTIME_BRIDGE_IMAGE:-justcampus-realtime-bridge:latest}
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: ${REALTIME_BRIDGE_PORT:-8089}
      BRIDGE_API_KEY: ${TRANSCRIPTION_REALTIME_BRIDGE_KEY:-}
      MAX_SESSIONS: ${REALTIME_BRIDGE_MAX_SESSIONS:-20}
      IDLE_TIMEOUT_S: ${REALTIME_BRIDGE_IDLE_TIMEOUT_S:-60}
      MAX_SESSION_S: ${REALTIME_BRIDGE_MAX_SESSION_S:-14400}
      # The university's outbound proxy, if the host needs one to reach the gateway.
      HTTPS_PROXY: ${REALTIME_BRIDGE_HTTPS_PROXY:-}
      NO_PROXY: ${REALTIME_BRIDGE_NO_PROXY:-localhost,127.0.0.1}
      # The bridge's own TURN client, normally the coturn below: turn:<host>:3478, with
      # credentials minted from its shared secret.
      TURN_URLS: ${REALTIME_BRIDGE_TURN_URLS:-}
      TURN_SECRET: ${TRANSCRIPTION_TURN_SECRET:-}
      STUN_URLS: ${REALTIME_BRIDGE_STUN_URLS:-}

  # A TURN relay for browsers without a direct UDP path to this host (firewalls, VPN): they reach
  # it on TURN_PORT (TCP and UDP) or, with a certificate, TLS on TURN_TLS_PORT, and it relays to
  # the bridge on this host. Short-lived credentials only (coturn use-auth-secret with
  # TRANSCRIPTION_TURN_SECRET, which the app also has): set the module's ICE servers, such as
  # turn:campus.example.uni-giessen.de:3478?transport=tcp, and TURN sign-in "short-lived".
  # Relays only to TURN_ALLOWED_PEER_IP (this host's address, which the bridge advertises); open
  # TURN_PORT/TURN_TLS_PORT and the relay range TURN_MIN_PORT-TURN_MAX_PORT (UDP) in the firewall.
  # With TURN_CERT_DIR holding cert.pem and key.pem, TLS (turns:) listens as well.
  coturn:
    profiles: ['realtime']
    image: coturn/coturn:4.17.2
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${TRANSCRIPTION_TURN_SECRET:-}
      TURN_REALM: ${TURN_REALM:-jlu-campus}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49250}
      TURN_ALLOWED_PEER_IP: ${TURN_ALLOWED_PEER_IP:-}
    volumes:
      - ${TURN_CERT_DIR:-./infra/realtime-bridge/no-certs}:/etc/coturn/certs:ro
    # The secret goes into a config file, not onto the command line where `ps` shows it. Every
    # peer but this host is denied, so the relay cannot be used to reach the internal network.
    entrypoint:
      - sh
      - -c
      - >-
        test -n "$$TURN_SECRET" || { echo 'TRANSCRIPTION_TURN_SECRET is not set' >&2; exit 1; };
        test -n "$$TURN_ALLOWED_PEER_IP" || { echo 'TURN_ALLOWED_PEER_IP is not set' >&2; exit 1; };
        printf 'static-auth-secret=%s\n' "$$TURN_SECRET" > /tmp/turnserver.conf &&
        if [ -r /etc/coturn/certs/cert.pem ] && [ -r /etc/coturn/certs/key.pem ]; then
        set -- --cert=/etc/coturn/certs/cert.pem --pkey=/etc/coturn/certs/key.pem
        --tls-listening-port="$$TURN_TLS_PORT"; else set -- --no-tls; fi;
        exec turnserver -c /tmp/turnserver.conf --log-file=stdout --simple-log
        --use-auth-secret --realm="$$TURN_REALM" --fingerprint --listening-port="$$TURN_PORT"
        --min-port="$$TURN_MIN_PORT" --max-port="$$TURN_MAX_PORT" --no-multicast-peers
        --denied-peer-ip=0.0.0.0-255.255.255.255 --denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
        --allowed-peer-ip="$$TURN_ALLOWED_PEER_IP" "$$@"

volumes:
  postgres-data:
  minio-data:
