# Local development infrastructure: Postgres, Keycloak and MinIO (the transcription module's
# object storage). Ports avoid 5432, which another project on this machine already uses.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: justcampus
      POSTGRES_PASSWORD: justcampus
      POSTGRES_DB: justcampus
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U justcampus -d justcampus']
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: 'false'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  # S3-compatible storage for transcription audio: API on 9100, console on 9101 (justcampus /
  # justcampus-dev-secret). MinIO no longer publishes images; pgsty/minio builds the same source.
  # Browsers upload and play through signed URLs, so the web origins need CORS.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: justcampus
      MINIO_ROOT_PASSWORD: justcampus-dev-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://localhost:3000,app://-
    ports:
      - '127.0.0.1:9100:9000'
      - '127.0.0.1:9101:9001'
    volumes:
      - minio-data:/data

  # Creates the bucket once MinIO answers, then exits.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    restart: on-failure
    entrypoint:
      - sh
      - -c
      - >-
        until mc alias set local http://minio:9000 justcampus justcampus-dev-secret; do sleep 1; done &&
        mc mb --ignore-existing local/justcampus-transcription &&
        mc anonymous set none local/justcampus-transcription

  # Live transcription, on-prem: the realtime bridge (infra/realtime-bridge, ported from kiChat)
  # takes the browser's WebRTC audio and streams it to the gateway's realtime WebSocket. Optional:
  #   docker compose --profile realtime up -d realtime-bridge
  # and set the module's bridge address to http://localhost:8089. Host networking, as WebRTC
  # media runs over UDP on ephemeral ports and the bridge's ICE candidates must carry the host's
  # addresses. The gateway credentials come from the Campus server with every session; the
  # bridge keeps none. BRIDGE_API_KEY is the server's TRANSCRIPTION_REALTIME_BRIDGE_KEY (.env).
  # Behind an outbound proxy it uses HTTPS_PROXY (and NO_PROXY) from the environment or .env.
  realtime-bridge:
    profiles: ['realtime']
    build: ./infra/realtime-bridge
    image: justcampus-realtime-bridge:dev
    network_mode: host
    environment:
      PORT: ${REALTIME_BRIDGE_PORT:-8089}
      # Development: signaling only for this machine; media still uses every interface. Without
      # TRANSCRIPTION_REALTIME_BRIDGE_KEY it takes loopback requests unauthenticated (the bridge
      # allows that only with a loopback HOST); with the key, only the server's.
      HOST: 127.0.0.1
      BRIDGE_API_KEY: ${TRANSCRIPTION_REALTIME_BRIDGE_KEY:-}
      BRIDGE_ALLOW_UNAUTHENTICATED: '1'
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      # TURN for the bridge itself, as for browsers: turn: URLs and coturn's shared secret.
      TURN_URLS: ${REALTIME_BRIDGE_TURN_URLS:-}
      TURN_SECRET: ${TRANSCRIPTION_TURN_SECRET:-}

  # A TURN relay to try the TURN path locally (browsers on this machine connect without one):
  #   docker compose --profile turn up -d coturn
  # then ICE servers turn:localhost:3478 with short-lived TURN credentials in the module's
  # settings and TRANSCRIPTION_TURN_SECRET in .env (coturn's static-auth-secret).
  coturn:
    profiles: ['turn']
    image: coturn/coturn:4.17.2
    network_mode: host
    environment:
      TURN_SECRET: ${TRANSCRIPTION_TURN_SECRET:-}
    # The secret goes into a config file, not onto the command line where `ps` shows it.
    entrypoint:
      - sh
      - -c
      - >-
        test -n "$$TURN_SECRET" || { echo 'TRANSCRIPTION_TURN_SECRET is not set' >&2; exit 1; };
        printf 'static-auth-secret=%s\n' "$$TURN_SECRET" > /tmp/turnserver.conf &&
        exec turnserver -c /tmp/turnserver.conf --log-file=stdout --simple-log
        --use-auth-secret --realm=localhost --fingerprint --listening-ip=127.0.0.1
        --listening-port=3478 --min-port=49160 --max-port=49200 --no-multicast-peers
        --allow-loopback-peers

volumes:
  postgres-data:
  minio-data:
